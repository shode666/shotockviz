# docker-compose.ghcr.yml — production deploy on the standalone droplet (188.166.234.146)
# via GitHub Actions → GHCR → server pull (server does NOT build).
#
# Sibling of docker-compose.prod.yml (which still serves the OLD shared droplet /
# shared-proxy network — untouched, do not delete). This file:
#   - uses `image:` (GHCR) instead of `build:` for every app service
#   - adds its own `caddy` service (no external shared-proxy network)
#   - is meant to be copied to /opt/shotockviz/docker-compose.ghcr.yml by .github/workflows/deploy.yml
#
# Usage on server:
#   IMAGE_TAG=<sha> docker compose -f docker-compose.ghcr.yml pull
#   IMAGE_TAG=<sha> docker compose -f docker-compose.ghcr.yml up -d --remove-orphans

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - stockviz-net

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - stockviz-net

  backend:
    container_name: stockviz-backend
    image: ghcr.io/shode666/shotockviz-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_ENV: production
      DEBUG: "False"
      LOG_LEVEL: info
      WORKERS: ${WORKERS:-2}
      TZ: ${TZ:-Asia/Bangkok}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - stockviz-net

  celery-worker:
    image: ghcr.io/shode666/shotockviz-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_ENV: production
      LOG_LEVEL: info
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - stockviz-net

  celery-beat:
    image: ghcr.io/shode666/shotockviz-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      APP_ENV: production
      LOG_LEVEL: info
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - stockviz-net

  telegram-bot:
    # Long-polling Telegram bot (`/start` replies with chat id) — stateless,
    # no DB/Redis use, but core.config validates JWT_SECRET_KEY under
    # APP_ENV=production so the same env block as celery-beat is passed.
    # Was dev-only (docker-compose.dev.yml) until 2026-09-05 — prod never ran it.
    image: ghcr.io/shode666/shotockviz-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      APP_ENV: production
      LOG_LEVEL: info
      TZ: ${TZ:-Asia/Bangkok}
    restart: unless-stopped
    command: python -m workers.telegram_bot
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - stockviz-net

  frontend:
    container_name: stockviz-frontend
    # VITE_* vars are baked in at GHA build time (frontend/Dockerfile:11-16) — no build args here
    image: ghcr.io/shode666/shotockviz-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - stockviz-net

  caddy:
    image: ghcr.io/shode666/shotockviz-caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - stockviz-net

networks:
  stockviz-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
