[pytest]
asyncio_mode = auto
# bd:deps-2026-09 iter1 (CHRIS-01/Q-4) — replaces the custom session-scoped
# `event_loop` fixture (removed from conftest.py; pytest-asyncio 1.x
# deleted that fixture entirely, 01-sara-adr-migration.md §2.3). Without
# this, real asyncpg connections opened by the app's own lifespan (under
# TestClient, real Postgres) get created under one event loop and torn
# down under another across tests in the same session, producing
# intermittent "Future attached to a different loop" RuntimeErrors that
# made `tests/api`'s totals non-reproducible run to run. Mirrors
# backend/pytest.ini's already-correct setting exactly.
asyncio_default_fixture_loop_scope = session
# bd:deps-2026-09 iter1 (Dave-discovered — a regression from the line
# above, not in Chris's/Quinn's original reports) — pytest-asyncio 1.x
# splits "which loop an async FIXTURE's body runs on" from "which loop the
# TEST FUNCTION itself runs on"; the latter defaults to `function` even
# with the fixture default set to `session` above (confirmed via
# `pytest --collect-only -q` header:
# `asyncio_default_fixture_loop_scope=session, asyncio_default_test_loop_scope=function`).
# That mismatch broke test_pr3_cache_service.py's own local `redis` async
# fixture (real redis.asyncio client, unlike this dir's sqlite fixtures,
# which tolerate cross-loop reuse because aiosqlite is thread-executor-based,
# not a real bound asyncio socket) — teardown raised "Task ... attached to
# a different loop" on 19/19 of that file's tests (100% reproducible,
# confirmed absent on the pre-iter1 conftest.py/pytest.ini baseline via
# `git stash` + rerun). Setting both to `session` mirrors the single
# session-wide loop the OLD custom `event_loop` fixture used to provide.
asyncio_default_test_loop_scope = session
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Shorter output format
addopts = -v --tb=short
