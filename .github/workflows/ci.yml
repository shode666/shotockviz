name: CI

on:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: stockviz
          POSTGRES_PASSWORD: stockviz
          POSTGRES_DB: stockviz_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install uv
          # bd:deps-2026-09 iter1 (CHRIS-07) — was `-r requirements.txt`
          # alone; WP-B1 moved pytest/pytest-asyncio/pytest-cov/aiosqlite
          # out into requirements-dev.txt (keeps the prod image clean,
          # S-AC-6) — the "Run tests" step below would otherwise fail with
          # `ModuleNotFoundError: No module named pytest`.
          # requirements-dev.txt itself `-r requirements.txt`s the prod
          # deps too, so this one line covers both.
          uv pip install -r requirements-dev.txt --system
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://stockviz:stockviz@localhost:5432/stockviz_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 15
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          # bd:deps-2026-09 iter1 (CHRIS-07, Dave-discovered addendum) —
          # was `ENVIRONMENT: test`; core/config.py's field is `app_env`,
          # pydantic-settings maps that to the `APP_ENV` env var (not
          # `ENVIRONMENT` — that name was never read by anything, a dead
          # var since this file was written).
          APP_ENV: test
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # bd:deps-2026-09 iter1 (CHRIS-07) — was '20'; this whole branch's
          # premise is the Node 24 migration (01-sara-adr-migration.md
          # §1.5) — CI was still building/type-checking on an untested
          # Node version.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          # bd:deps-2026-09 iter1 (CHRIS-07) — was `frontend/dist/`; Nitro
          # (TanStack Start SSR) outputs to `.output/`, never `dist/` —
          # confirmed via frontend/Dockerfile:28 (`COPY --from=builder
          # .../app/.output ./.output`). Pre-existing bug, unrelated to
          # this migration, left unfixed until now (Sara flagged it too).
          path: frontend/.output/
          retention-days: 7

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: shotockviz-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: shotockviz-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
