name: Deploy

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run 'alembic upgrade head' after the new containers are up"
        type: boolean
        default: true
      image_tag:
        description: "Override image tag to build/deploy (default: git sha of the triggering commit)"
        type: string
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}

jobs:
  build-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, caddy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (${{ matrix.service }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/shode666/shotockviz-${{ matrix.service }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      # frontend bakes VITE_* at build time (frontend/Dockerfile:11-16) — needs DOMAIN + Google client id
      - name: Build and push frontend
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=wss://${{ vars.DOMAIN }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build and push ${{ matrix.service }}
        if: matrix.service != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to droplet
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -z "${{ vars.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "::error::vars.DEPLOY_KNOWN_HOSTS is empty — run scripts/setup-gh-secrets.sh first (ssh-keyscan pin). Refusing to disable host key checking."
            exit 1
          fi
          printf '%s\n' "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy compose file to server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/shotockviz"
          scp -i ~/.ssh/deploy_key docker-compose.ghcr.yml "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/shotockviz/docker-compose.ghcr.yml"

      - name: docker login on server (token via stdin, never echoed)
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Pull + up
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "${{ env.IMAGE_TAG }}" <<'REMOTE'
            set -euo pipefail
            cd /opt/shotockviz
            export IMAGE_TAG="$1"
            docker compose -f docker-compose.ghcr.yml pull
            docker compose -f docker-compose.ghcr.yml up -d --remove-orphans
          REMOTE

      - name: Run migrations
        if: ${{ inputs.run_migrations }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "${{ env.IMAGE_TAG }}" <<'REMOTE'
            set -euo pipefail
            cd /opt/shotockviz
            export IMAGE_TAG="$1"
            # init_db.py handles both fresh DBs (no alembic_version/users table —
            # bootstraps via create_all since no migration ever CREATEs the base
            # tables, only alembic upgrade head) and existing DBs (plain
            # alembic upgrade head). See backend/scripts/init_db.py for root cause.
            docker compose -f docker-compose.ghcr.yml run --rm backend python scripts/init_db.py
          REMOTE

      - name: Health check (90s budget)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<'REMOTE'
            set -euo pipefail
            cd /opt/shotockviz
            ok=0
            for i in $(seq 1 18); do
              if docker compose -f docker-compose.ghcr.yml exec -T backend curl -sf http://localhost:8000/api/health; then
                ok=1
                break
              fi
              sleep 5
            done
            docker compose -f docker-compose.ghcr.yml ps
            if [ "$ok" -ne 1 ]; then
              echo "::error::backend /api/health did not become healthy within 90s"
              exit 1
            fi
          REMOTE

      - name: Prune old images
        if: always()
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "docker image prune -f"
