[pytest]
# Pytest configuration for ShotockViz backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests

# Async configuration
asyncio_mode = auto
# bd:deps-2026-09 WP-B2 — pytest-asyncio 1.x removed the `event_loop` fixture
# and its `scope` marker arg; this ini option replaces the session-scoped
# custom fixture that used to live in tests/conftest.py (01-sara-adr-migration.md §2.3).
asyncio_default_fixture_loop_scope = session

# Output options
# bd:deps-2026-09 WP-B0: -m "not integration" deselects live-stack tests
# (test_user_simulation.py) per outputs/deps-2026-09/03-stan-refactor-strategy.md
# § r3-B-1 — .github/workflows/ci.yml is explicitly NOT touched (user decision #2,
# 02-bella-brd-ac.md DoD item 16); this local addopts change is the only deselect.
addopts =
    --strict-markers
    --tb=short
    -ra
    -m "not integration"
# --disable-warnings dropped for this branch (01-sara-adr-migration.md §2.3):
# deprecation-warning visibility needed during migration; restore after if noisy.

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.11
